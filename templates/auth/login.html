{% extends "base.html" %}

{% block title %}Sign In — CampusSkill AI{% endblock %}

{% block content %}
<div class="container py-5 my-auto">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="saas-card p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="brand-icon mx-auto mb-2" style="width: 48px; height: 48px; font-size: 1.3rem;">
                        <i class="bi bi-person-fill-lock"></i>
                    </div>
                    <h3 class="text-white fw-bold mb-1">Welcome Back</h3>
                    <p class="text-muted small">Sign in to your CampusSkill AI account</p>
                </div>

                <form method="POST" action="{{ url_for('auth.login') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                    <div class="mb-3">
                        <label class="form-label-custom" for="email">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control form-control-custom" id="email" name="email" required placeholder="name@college.edu">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label-custom" for="password">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control form-control-custom" id="password" name="password" required placeholder="••••••••">
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="remember" name="remember">
                            <label class="form-check-label small text-muted" for="remember">Keep me signed in</label>
                        </div>
                        <span class="small text-secondary">Secured by Werkzeug</span>
                    </div>

                    <button type="submit" class="btn btn-primary-custom w-100 py-2 fs-6 mb-3">
                        Sign In <i class="bi bi-arrow-right ms-1"></i>
                    </button>
                </form>

                <!-- Quick Demo Fill Helpers for Convenience -->
                <div class="border-top border-secondary border-opacity-25 pt-3 mt-2">
                    <p class="small text-muted mb-2 text-center fw-semibold">Quick Demo Logins (Click to populate):</p>
                    <div class="d-flex flex-wrap gap-2 justify-content-center">
                        <button type="button" class="btn btn-outline-custom btn-sm py-1 px-2" onclick="fillDemo('student@campusskill.edu', 'Student@123')">
                            <i class="bi bi-mortarboard me-1 text-info"></i> Student
                        </button>
                        <button type="button" class="btn btn-outline-custom btn-sm py-1 px-2" onclick="fillDemo('placement@campusskill.edu', 'Placement@123')">
                            <i class="bi bi-briefcase me-1 text-warning"></i> Placement
                        </button>
                        <button type="button" class="btn btn-outline-custom btn-sm py-1 px-2" onclick="fillDemo('admin@campusskill.edu', 'Admin@123')">
                            <i class="bi bi-shield me-1 text-danger"></i> Admin
                        </button>
                    </div>
                </div>

                <div class="text-center mt-4 small text-muted">
                    Don't have an account yet? <a href="{{ url_for('auth.register') }}" class="text-info fw-semibold text-decoration-none">Create Student Profile</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function fillDemo(email, pwd) {
    document.getElementById('email').value = email;
    document.getElementById('password').value = pwd;
}
</script>
{% endblock %}
